name: AUR sync check

on:
  workflow_dispatch: {}
  # Schedule intentionally disabled — AUR's own git/ssh backend has been in
  # an extended outage since ~2026-08-04 (community-reported, see repo
  # README), so a cron trigger just piles up failed runs against an
  # external problem we can't fix. Re-enable once AUR is confirmed stable:
  #
  # schedule:
  #   # Offset off :00/:30 on purpose — GitHub's docs flag the top of every
  #   # hour (and half-hour) as high-load times where scheduled runs get
  #   # delayed or silently dropped; observed zero firings in 11.5h at
  #   # '*/30 * * * *' before switching to this offset.
  #   - cron: '7,37 * * * *'

permissions:
  contents: write

jobs:
  check-and-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve upstream HEAD
        id: upstream
        run: |
          SHA=$(git ls-remote https://github.com/wjbeckett/artemis.git refs/heads/develop | cut -f1)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      # Restore-only. Whether this SHA gets marked "seen" is decided at the
      # END of the job (see "Mark SHA as fully synced") and only if the
      # whole pipeline — build AND the AUR push — actually succeeded.
      # Marking it seen up front would let a genuinely broken SHA get
      # cached as done after just the build step, silently skipping retries
      # forever even though nothing was ever pushed.
      - name: Gate on known SHA
        id: gate
        uses: actions/cache/restore@v4
        with:
          path: .state/seen
          key: seen-${{ steps.upstream.outputs.sha }}

      - name: Build-check + regen .SRCINFO in Arch container
        if: steps.gate.outputs.cache-hit != 'true'
        run: |
          HOST_UID=$(id -u)
          HOST_GID=$(id -g)
          mkdir -p logs
          set -o pipefail
          docker run --rm -v "$PWD:/work" -w /work -e HOST_UID="$HOST_UID" -e HOST_GID="$HOST_GID" archlinux:latest bash -c '
            set -e
            pacman -Sy --noconfirm --needed base-devel git sudo \
              qt6-base qt6-declarative qt6-svg qt6-multimedia ffmpeg sdl2 sdl2_ttf \
              opus openssl libva libvdpau libplacebo libxkbcommon hicolor-icon-theme \
              vulkan-headers wayland-protocols qt6-tools
            useradd -m builder
            chown -R builder:builder /work
            su builder -c "cd /work && makepkg -s --noconfirm --skippgpcheck --log"
            su builder -c "cd /work && makepkg --printsrcinfo > .SRCINFO"
            su builder -c "cd /work && mv -f *-build.log logs/build.log 2>/dev/null || true"
            su builder -c "cd /work && rm -rf src pkg *.pkg.tar.zst *.pkg.tar.zst.sig" || true
            # Undo the chown above — /work is the runner'"'"'s git checkout, and
            # leaving it owned by the in-container builder UID breaks every
            # git command the job runs after this step (permission denied on
            # .git/config since the runner user no longer owns it).
            chown -R "$HOST_UID:$HOST_GID" /work
          ' 2>&1 | tee logs/full-container-output.log

      - name: Extract compiler warnings summary
        if: steps.gate.outputs.cache-hit != 'true'
        run: |
          grep -E ': warning: ' logs/full-container-output.log | sort -u > logs/warnings-summary.log || true
          echo "### Compiler warnings: $(wc -l < logs/warnings-summary.log)" >> "$GITHUB_STEP_SUMMARY"
          if [ -s logs/warnings-summary.log ]; then
            { echo '```'; cat logs/warnings-summary.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload build logs
        if: always() && steps.gate.outputs.cache-hit != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_id }}
          path: |
            logs/full-container-output.log
            logs/build.log
            logs/warnings-summary.log
            .SRCINFO
          retention-days: 30
          if-no-files-found: warn

      - name: Read resolved pkgver
        if: steps.gate.outputs.cache-hit != 'true'
        id: pkgver
        run: echo "ver=$(grep -m1 'pkgver = ' .SRCINFO | awk -F' = ' '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Commit refreshed .SRCINFO to this repo
        if: steps.gate.outputs.cache-hit != 'true'
        run: |
          git config user.name "artemis-qt-git-aur-ci"
          git config user.email "actions@users.noreply.github.com"
          git add .SRCINFO
          git diff --cached --quiet || git commit -m "sync: pkgver ${{ steps.pkgver.outputs.ver }} (upstream ${{ steps.upstream.outputs.sha }})"
          git push

      - name: Push to AUR
        if: steps.gate.outputs.cache-hit != 'true'
        id: aur_push
        env:
          SSH_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/aur_ed25519
          chmod 600 ~/.ssh/aur_ed25519
          ssh-keyscan -H aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/aur_ed25519 -o IdentitiesOnly=yes -o ConnectTimeout=15"

          # AUR's git/ssh backend has known transient blips (distinct from
          # the extended outage this repo was built during) — a handful of
          # short retries covers those without needing a manual re-run for
          # every flake, while still failing fast on a real, sustained
          # outage instead of hanging the job.
          attempt=0
          until git clone ssh://aur@aur.archlinux.org/artemis-qt-git.git aur-repo 2>clone.err; do
            attempt=$((attempt+1))
            cat clone.err >&2
            if [ "$attempt" -ge 3 ]; then
              echo "::error::AUR clone failed after 3 attempts — likely an AUR-side outage, not a pipeline bug. See clone.err above."
              exit 1
            fi
            echo "Clone attempt $attempt failed, retrying in 20s..."
            sleep 20
          done

          cp PKGBUILD .SRCINFO aur-repo/
          cd aur-repo
          git config user.name "Emilwojcik93"
          git config user.email "emilwojcik93@gmail.com"
          git add PKGBUILD .SRCINFO
          git diff --cached --quiet && echo "No AUR-visible change, skipping push." || {
            git commit -m "CI: sync pkgver ${{ steps.pkgver.outputs.ver }} (upstream ${{ steps.upstream.outputs.sha }})"
            git push
          }

      # Only reached if build-check AND the AUR push both succeeded (or the
      # gate already skipped because this SHA was previously fully synced).
      # This is what actually marks the SHA done — see the comment on
      # "Gate on known SHA" for why that matters.
      - name: Mark SHA as fully synced
        if: steps.gate.outputs.cache-hit != 'true' && success()
        run: mkdir -p .state && echo "${{ steps.upstream.outputs.sha }}" > .state/seen

      - name: Save sync-complete cache
        if: steps.gate.outputs.cache-hit != 'true' && success()
        uses: actions/cache/save@v4
        with:
          path: .state/seen
          key: seen-${{ steps.upstream.outputs.sha }}

      - name: Note failure reason
        if: failure()
        run: |
          if [ "${{ steps.aur_push.outcome }}" = "failure" ]; then
            echo "::error::AUR push failed against upstream ${{ steps.upstream.outputs.sha }} — build itself succeeded, this looks like an AUR-side (git/ssh backend) problem, not a PKGBUILD issue. This SHA was NOT marked as synced, so it will be retried on the next manual run."
          else
            echo "::error::Build check failed against upstream ${{ steps.upstream.outputs.sha }} — PKGBUILD likely needs a manual fix (new dep, build-system change). Nothing was pushed to AUR."
          fi
